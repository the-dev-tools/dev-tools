          assertions:
            - response.status == 200
      - request:
          name: PostOrders
          depends_on: GetProducts2
          method: POST
          url: '{{ #env:APP_URL }}/api/orders'
          body:
            type: json
            json:
              productId: 42
          assertions:
            - response.status == 201
            - response.body.productId == 42
      - graphql:
          name: OrderStatus
          depends_on: PostOrders
          url: '{{ #env:APP_URL }}/graphql'
          query: 'query OrderStatus($id: ID!) { order(id: $id) { status } }'
          variables: '{"id":"{{ PostOrders.response.body.orderId }}"}'
          assertions:
            - response.status == 200
