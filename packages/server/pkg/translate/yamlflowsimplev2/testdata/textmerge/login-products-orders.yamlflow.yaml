workspace_name: Recorded
flows:
  - name: login-products-orders
    steps:
      - manual_start:
          name: Start
      - request:
          name: PostLogin
          depends_on: Start
          method: POST
          url: '{{ #env:APP_URL }}/api/login'
          body:
            type: json
            json:
              username: demo
              password: '{{ #env:STRESSEUR_PASSWORD }}'
          assertions:
            - response.status == 200
