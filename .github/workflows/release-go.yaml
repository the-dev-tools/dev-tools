name: Release / Go

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Go Binary
    # Deliberately no `continue-on-error: true`. It used to be set here, which
    # forced every row's conclusion to success even when the build died, so
    # cli@1.1.0 published 4 of its 6 assets behind a green check and the two
    # broken Windows rows went unnoticed until someone opened the logs by hand.
    # A release that cannot produce an asset must fail the run that publishes it.
    #
    # fail-fast: false preserves the one useful thing continue-on-error was
    # doing by accident: rows stay independent. Without it, the first failing
    # target would cancel the five healthy ones still in flight — including the
    # ~20 minute darwin-x64 build — and strand the release half-published.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-latest
            platform: linux-arm64
          - runner: windows-latest
            platform: win32-x64
          - runner: windows-latest
            platform: win32-ia32
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup runner environment
        uses: ./.github/actions/setup

      - id: info
        name: Get project information
        run: gha-scripts export-project-info

      - name: Build Binary
        env:
          VERSION: ${{ steps.info.outputs.VERSION }}
          PLATFORM: ${{ matrix.platform }}
          CGO_ENABLED: '0'
        run: pnpm nx run ${{ steps.info.outputs.NAME }}:build:release

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gha-scripts upload-go-release-assets

  # The Go source of the CLI and the modules it imports, generated code included, for programs
  # that embed the CLI as a library (Stresseur's `stress`) and pin it by release version.
  go-source:
    name: Publish Go source bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup runner environment
        uses: ./.github/actions/setup

      - id: info
        name: Get project information
        run: gha-scripts export-project-info

      - name: Generate code that isn't in git
        run: |
          pnpm nx run spec:build
          pnpm nx run cli:copy-worker

      - name: Write the bundle
        run: apps/cli/scripts/go-source-bundle.sh "$RUNNER_TEMP/devtools-go-src-${{ steps.info.outputs.VERSION }}.tar.gz"

      - name: Upload the bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/devtools-go-src-${{ steps.info.outputs.VERSION }}.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

  # checksums.txt covers every asset, so it is written once, after all rows
  # above have uploaded their binary. It is skipped if any row failed (the run
  # fails anyway). install.sh verifies downloads against it and still works for
  # older releases that have none.
  checksums:
    name: Publish checksums.txt
    needs: [build, go-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"

      - name: Write checksums.txt
        run: |
          apps/cli/scripts/write-checksums.sh "$RUNNER_TEMP/assets" > "$RUNNER_TEMP/checksums.txt"
          cat "$RUNNER_TEMP/checksums.txt"

      # --clobber makes a re-run replace the file instead of failing on it.
      - name: Upload checksums.txt
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/checksums.txt" --repo "$GITHUB_REPOSITORY" --clobber
