# Pre-existing gap (not fixed by this task, see task-1-report.md Concerns):
# sub_flow_trigger is not exercised anywhere in this corpus because it does
# not survive export. processSteps overwrites the flow node's ID with the
# flow's start-node ID (converter_node.go:235) so the trigger acts as the
# flow's entry point, but NodeSubFlowTrigger.FlowNodeID keeps the original,
# pre-overwrite ID (converter_node.go:788). The exporter's lookup map is
# keyed by that original FlowNodeID (exporter.go:145) but probed with the
# node's actual (overwritten) ID (exporter.go:661), so the lookup always
# misses and the sub_flow_trigger step is silently dropped from the
# exported YAML - which then fails to re-import, since other steps still
# depend on it by name. GreeterFlow below uses a plain manual_start instead.
workspace_name: Golden Sub Flows
flows:
  - name: MainFlow
    steps:
      - manual_start:
          name: Start
      - request:
          name: FetchUser
          depends_on: Start
          method: GET
          url: https://api.example.com/users/1
      - run_sub_flow:
          name: CallGreeter
          depends_on: FetchUser
          flow: GreeterFlow
          inputs:
            userName: '{{ FetchUser.response.body.name }}'
      - js:
          name: UseGreeting
          depends_on: CallGreeter
          code: |
            export default function(context) {
              return { greeting: context.CallGreeter };
            }
  - name: GreeterFlow
    steps:
      - manual_start:
          name: Start
      - js:
          name: BuildGreeting
          depends_on: Start
          code: |
            export default function(context) {
              return { greeting: "Hello " + context.userName };
            }
      - sub_flow_return:
          name: Return
          depends_on: BuildGreeting
          outputs:
            - name: greeting
              expression: BuildGreeting.greeting
