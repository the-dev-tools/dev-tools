workspace_name: Golden Environments Credentials
credentials:
  - name: primary-openai
    type: openai
    token: '{{ #env:PRIMARY_OPENAI_TOKEN }}'
  - name: secondary-anthropic
    type: anthropic
    api_key: '{{ #env:SECONDARY_ANTHROPIC_KEY }}'
active_environment: staging
global_environment: shared
environments:
  - name: default
    variables:
      base_url: https://api.example.com
  - name: staging
    description: Staging environment
    variables:
      base_url: https://staging.api.example.com
      api_token: '{{ #env:STAGING_API_TOKEN }}'
  - name: shared
    variables:
      shared_flag: 'true'
flows:
  - name: EnvFlow
    steps:
      - manual_start:
          name: Start
      - request:
          name: PingAPI
          depends_on: Start
          method: GET
          url: '{{ base_url }}/ping'
          headers:
            Authorization: 'Bearer {{ api_token }}'
