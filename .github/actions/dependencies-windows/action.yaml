name: Setup Windows dependencies
description: Install the Scoop build toolchain and AzureSignTool, and pin pnpm to the version the Nix flake uses elsewhere.

runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~\scoop
        key: scoop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.\scoop.json') }}

    - uses: MinoruSekine/setup-scoop@v4.0.1
      with:
        install_scoop: ${{ steps.cache.outputs.cache-hit != 'true' }}
        scoop_update: false

    - shell: powershell
      run: scoop import .\scoop.json

    # Export additional paths which the setup action does not account for
    #
    # Why in reverse? Appending a directory to $GITHUB_PATH causes that
    # directory to be prepended to $PATH. Thus we preserve their order by
    # reversing them before they are reversed again
    - shell: powershell
      run: |
        scoop list |
          %{ scoop info $_.Name --verbose } |
          %{ $_."Path Added" -Split "`n" } |
          Where { $_ } |
          &{ [Collections.Stack]@($input) } |
          Out-File -FilePath $env:GITHUB_PATH -Encoding ascii -Force

    # Pin pnpm to the same version as the Nix flake used on all other
    # platforms. Scoop always installs the bucket's latest, which drifts
    # across major versions (pnpm 11 rejects installs that pnpm 10 accepts)
    # and cannot install old versions (the current manifest's artifact
    # layout does not exist for 10.x releases). Uninstall any pnpm left in
    # a cached scoop dir so its shim cannot shadow the pinned binary.
    - shell: powershell
      run: |
        if (scoop list | Where { $_.Name -eq 'pnpm' }) { scoop uninstall pnpm }
        New-Item -ItemType Directory -Force $env:RUNNER_TEMP\pnpm | Out-Null
        Invoke-WebRequest `
          https://github.com/pnpm/pnpm/releases/download/v10.15.1/pnpm-win-x64.exe `
          -OutFile $env:RUNNER_TEMP\pnpm\pnpm.exe
        echo $env:RUNNER_TEMP\pnpm >> $env:GITHUB_PATH

    - shell: powershell
      run: scoop shim add gha-scripts pnpm '--' run --filter="*/gha-scripts" cli

    - shell: powershell
      run: |
        Invoke-WebRequest `
          https://github.com/vcsjones/AzureSignTool/releases/download/v6.0.1/AzureSignTool-x64.exe `
          -OutFile $env:RUNNER_TEMP/AzureSignTool.exe

    - shell: powershell
      run: echo $env:RUNNER_TEMP >> $env:GITHUB_PATH
