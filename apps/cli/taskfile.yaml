# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  APP_NAME: cli
  BIN_DIR: dist
  SOURCE_PATH: main.go

tasks:
  copy:worker:
    cmds:
      - task: ensure-dir
        vars:
          DIR: embedded/embeddedJS
      - cmd: cp ../../packages/worker-js/dist/main.cjs embedded/embeddedJS/worker.cjs.embed
        platforms: [linux, darwin]
      - cmd: cmd /c copy "..\\..\\packages\\worker-js\\dist\\main.cjs" "embedded\\embeddedJS\\worker.cjs.embed"
        platforms: [windows]

  ensure-dir:
    internal: true
    silent: true
    cmds:
      - cmd: mkdir -p {{.DIR}}
        platforms: [linux, darwin]
      - cmd: cmd /c if not exist "{{.DIR}}" mkdir "{{.DIR}}"
        platforms: [windows]

  build:release:
    desc: Build release binary with version and platform
    vars:
      VERSION_DEFAULT:
        sh: node -e "console.log(require('./package.json').version)"
      GOOS_DEFAULT:
        sh: go env GOOS
      GOARCH_DEFAULT:
        sh: go env GOARCH
      # VERSION / PLATFORM / BINARY_SUFFIX resolve in this order:
      #   1. an explicit Task CLI argument (task build:release PLATFORM=linux-arm64)
      #   2. the process environment       (release-go.yaml exports both on the step)
      #   3. the native default            (package.json version, host GOOS/GOARCH)
      #
      # Step 2 is what makes this work on every runner. Nx spawns a POSIX shell
      # on Linux/macOS but cmd.exe on Windows, and cmd.exe does not expand
      # "${VAR}", so a target command written as `task build:release
      # VERSION=${VERSION}` handed go-task the *literal* string "${PLATFORM}" on
      # the two Windows rows. That used to be survivable by accident: PLATFORM
      # only ever reached a command line, where go-task's embedded POSIX
      # interpreter re-expanded it from the environment. Once PLATFORM started
      # driving GOOS/GOARCH at template level the literal went straight into the
      # toolchain and every Windows release job died with
      #   go: unsupported GOOS/GOARCH pair ${PLATFORM}/${PLATFORM}
      # project.json therefore passes no inline arguments at all, and a CLI value
      # that still contains "${" is treated as an unexpanded leak and ignored in
      # favour of the environment. The preconditions below fail the build loudly
      # if a literal survives even that, so it can never reach GOOS again.
      VERSION_ARG: '{{.VERSION | default ""}}'
      PLATFORM_ARG: '{{.PLATFORM | default ""}}'
      SUFFIX_ARG: '{{.BINARY_SUFFIX | default ""}}'
      VERSION_RESOLVED: '{{if and .VERSION_ARG (not (contains "${" .VERSION_ARG))}}{{.VERSION_ARG}}{{else if env "VERSION"}}{{env "VERSION"}}{{else}}{{.VERSION_DEFAULT}}{{end}}'
      PLATFORM_RESOLVED: '{{if and .PLATFORM_ARG (not (contains "${" .PLATFORM_ARG))}}{{.PLATFORM_ARG}}{{else}}{{env "PLATFORM"}}{{end}}'
      SUFFIX_RESOLVED: '{{if and .SUFFIX_ARG (not (contains "${" .SUFFIX_ARG))}}{{.SUFFIX_ARG}}{{else}}{{env "BINARY_SUFFIX"}}{{end}}'
      # PLATFORM arrives from release-go.yaml's build matrix as "<os>-<arch>"
      # in Node/Electron naming: darwin-x64, darwin-arm64, linux-x64,
      # linux-arm64, win32-x64, win32-ia32.
      #
      # It used to be interpolated into the output *filename* only, so a
      # matrix row always built for whatever architecture its runner happened
      # to be and merely named the result after the platform it claimed. Both
      # cross-compiled rows share a runner with their x64 sibling, so
      # cli@1.0.3 published linux-arm64 and win32-ia32 assets that were
      # byte-identical x86-64 binaries. Translate PLATFORM into GOOS/GOARCH so
      # the binary matches the name it ships under. The CLI is pure Go with
      # CGO_ENABLED=0, so every one of these targets cross-compiles.
      #
      # With no PLATFORM (local dev), both fall back to the host toolchain's
      # own values and the build is byte-for-byte what it was before.
      PLATFORM_OS: '{{if .PLATFORM_RESOLVED}}{{splitList "-" .PLATFORM_RESOLVED | first}}{{end}}'
      PLATFORM_ARCH: '{{if .PLATFORM_RESOLVED}}{{splitList "-" .PLATFORM_RESOLVED | last}}{{end}}'
      GOOS_TARGET: '{{if .PLATFORM_OS}}{{if eq .PLATFORM_OS "win32"}}windows{{else}}{{.PLATFORM_OS}}{{end}}{{else}}{{.GOOS_DEFAULT}}{{end}}'
      GOARCH_TARGET: '{{if .PLATFORM_ARCH}}{{if eq .PLATFORM_ARCH "x64"}}amd64{{else if eq .PLATFORM_ARCH "ia32"}}386{{else}}{{.PLATFORM_ARCH}}{{end}}{{else}}{{.GOARCH_DEFAULT}}{{end}}'
      # Windows assets need .exe or they publish as extensionless PE files
      # that Windows refuses to execute until renamed. release-go.yaml never
      # sets BINARY_SUFFIX, so derive it; an explicitly passed value wins.
      SUFFIX: '{{if .SUFFIX_RESOLVED}}{{.SUFFIX_RESOLVED}}{{else if eq .GOOS_TARGET "windows"}}.exe{{end}}'
      OUTPUT_PLATFORM: '{{.PLATFORM_RESOLVED | default (printf "%s-%s" .GOOS_DEFAULT .GOARCH_DEFAULT)}}'
    preconditions:
      # Last line of defence: never hand an unexpanded "${...}" to the toolchain
      # or into an asset filename. Fail with the offending values named.
      - sh: '{{if or (contains "${" .VERSION_RESOLVED) (contains "${" .PLATFORM_RESOLVED) (contains "${" .SUFFIX)}}exit 1{{else}}exit 0{{end}}'
        msg: 'Unexpanded shell literal in release variables (VERSION="{{.VERSION_RESOLVED}}" PLATFORM="{{.PLATFORM_RESOLVED}}" BINARY_SUFFIX="{{.SUFFIX}}"). Export VERSION/PLATFORM in the environment instead of passing "${VAR}" as a Task argument.'
      # A literal PLATFORM argument with nothing in the environment to recover
      # from must not quietly degrade to a host-native build: that is how a
      # release row ends up publishing an asset for a platform it never built.
      # VERSION has a correct fallback (package.json), PLATFORM does not.
      - sh: '{{if and (contains "${" .PLATFORM_ARG) (not .PLATFORM_RESOLVED)}}exit 1{{else}}exit 0{{end}}'
        msg: 'PLATFORM was passed as the unexpanded literal "{{.PLATFORM_ARG}}" and no PLATFORM environment variable is set to fall back to. Refusing to build a host-native binary for a cross-platform release.'
    env:
      CGO_ENABLED: 0
      GOOS: '{{.GOOS_TARGET}}'
      GOARCH: '{{.GOARCH_TARGET}}'
    cmds:
      - task: ensure-dir
        vars:
          DIR: dist
      # Use `.` (package target) + `-tags cli` so mode_cli.go is included and runCLI is wired.
      # Building `main.go` as the target silently drops tagged companion files in the same package.
      # -ldflags -X injects the release version into cmd.version so `devtools version`
      # identifies the build instead of always printing the source placeholder.
      - go build -tags cli -ldflags "-X github.com/the-dev-tools/dev-tools/apps/cli/cmd.version=v{{.VERSION_RESOLVED}}" -o {{.BIN_DIR}}/devtools-cli-{{.VERSION_RESOLVED}}-{{.OUTPUT_PLATFORM}}{{.SUFFIX}} .

  clean:
    desc: Clean build artifacts
    cmds:
      - cmd: rm -rf {{.BIN_DIR}}
        platforms: [linux, darwin]
      - cmd: cmd /c rd /s /q "{{.BIN_DIR}}"
        platforms: [windows]
        ignore_error: true
