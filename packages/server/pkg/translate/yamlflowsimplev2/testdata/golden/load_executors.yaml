# Exercises every load executor plus think time, thresholds (both spellings)
# and abort rules. The list-form thresholds of ramp-checkout export in the
# canonical map form, and the abort shorthand stays a shorthand.
workspace_name: Golden Load Executors
flows:
  - name: Checkout
    steps:
      - manual_start:
          name: Start
      - request:
          name: PostLogin
          depends_on: Start
          method: POST
          url: https://api.example.com/login
      - request:
          name: CreateOrder
          depends_on: PostLogin
          method: POST
          url: https://api.example.com/orders
load:
  - name: ramp-checkout
    flow: Checkout
    executor: ramping-vus
    start_vus: 0
    stages:
      - { duration: 30s, target: 20 }
      - { duration: 2m, target: 20 }
      - { duration: 30s, target: 0 }
    graceful_ramp_down: 10s
    think_time: { min: 1s, max: 3s }
    thresholds:
      - errors<1%
      - p95<300ms
      - p95(PostLogin)<500ms
    abort:
      - errors>20%
      - when: p95>2s
        window: 1m
        delay: 30s
  - name: steady-checkout
    flow: Checkout
    executor: constant-arrival-rate
    rate: 50
    time_unit: 1s
    duration: 5m
    pre_allocated_vus: 20
    max_vus: 200
    think_time: 500ms
    thresholds:
      p99: <1s
      steps:
        CreateOrder:
          errors: <0.5%
  - name: spike-checkout
    flow: Checkout
    executor: ramping-arrival-rate
    start_rate: 10
    time_unit: 1m
    stages:
      - { duration: 1m, target: 600 }
      - { duration: 1m, target: 0 }
    pre_allocated_vus: 10
    max_vus: 100
    graceful_stop: 15s
